<style>
:root{color-scheme:light;--bg:#ECE9E3;--ink:#1C1B19;--muted:#6B665D;--line:#D8D3CA;--acc:#5E1A26}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}

header .home{white-space:nowrap;font-size:13px;color:var(--muted);text-decoration:none}
header b{white-space:nowrap;font-size:14px} header b span{color:var(--acc)}
nav{display:flex;gap:6px;overflow-x:auto;min-width:0}
nav a{white-space:nowrap;color:var(--ink);text-decoration:none;font-size:13px;padding:5px 10px;border:1px solid var(--line);border-radius:99px}
nav a:hover,nav a:focus-visible{border-color:var(--acc);outline:none}
main{max-width:1600px;margin:auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));

section{scroll-margin-top:72px}

/><text x="120.0" y="538.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#5E1A26" letter-spacing="3">МИССИЯ</text><text x="120.0" y="588.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#2B0D14">Возвращаем простому продукту статус</text><text x="120.0" y="625.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#2B0D14">деликатеса: отбираем лучшие яйца</text><text x="120.0" y="663.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#2B0D14">испанских ферм и доставляем их шефам и</text><text x="120.0" y="700.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#2B0D14">гурманам с безупречной заботой винного</text><text x="120.0" y="738.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#2B0D14">дома.</text><line x1="693.3" y1="488" x2="1226.7" y2="488" stroke="#2B0D14" stroke-width="2"/><text x="693.3" y="538.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#5E1A26" letter-spacing="3">ВИДЕНИЕ</text><text x="693.3" y="588.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#2B0D14">Стать в Испании именем, которое на</text><text x="693.3" y="625.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#2B0D14">кухне произносят так же уважительно,</text><text x="693.3" y="663.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#2B0D14">как название хорошего винного дома.</text><line x1="1266.7" y1="488" x2="1800.0" y2="488" stroke="#2B0D14" stroke-width="2"/><text x="1266.7" y="538.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#5E1A26" letter-spacing="3">ПОЗИЦИОНИРОВАНИЕ</text><text x="1266.7" y="588.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#2B0D14">Премиальный поставщик яиц и</text><text x="1266.7" y="625.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#2B0D14">яйцепродуктов для ресторанов высокой</text><text x="1266.7" y="663.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#2B0D14">кухни, отелей, кондитерских и</text><text x="1266.7" y="700.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#2B0D14">гастрономического ретейла Испании. В</text><text x="1266.7" y="738.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#2B0D14">отличие от массовых дистрибьюторов мы</text><text x="1266.7" y="775.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#2B0D14">продаём отбор, происхождение и сервис</text><text x="1266.7" y="813.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="400" fill="#2B0D14">уровня «maison», а не тонны.</text></svg></section><section id="s03" aria-label="03 Ценности"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img"><rect width="1920" height="1080" fill="#FBFAF7"/><text x="120.0" y="92.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#89787A" letter-spacing="3">PRIMEEGG · БРЕНДБУК · PE-04.05</text><text x="1800.0" y="92.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#89787A" text-anchor="end" letter-spacing="2">03 / 12</text><text x="120.0" y="196.0" font-family="Josefin Sans, Georgia, serif" font-size="60" font-weight="600" fill="#2B0D14">Ценности</text><text x="120.0" y="1016.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#89787A">Этикетка Maison</text><text x="1800.0" y="1016.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#89787A" text-anchor="end">Primeegg Distribution SL · 26.11.2026</text><rect x="120.0" y="250.0" width="399.0" height="640.0" rx="16" fill="#FFFFFF" stroke="#DCD6D5"/><text x="156.0" y="330.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#5E1A26" letter-spacing="2">01</text><text x="156.0" y="430.0" font-family="Josefin Sans, Georgia, serif" font-size="44" font-weight="600" fill="#2B0D14">Отбор</text><text x="156.0" y="522.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#89787A">В коробку попадает только</text><text x="156.0" y="556.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#89787A">то, что мы сами подали бы</text><text x="156.0" y="591.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#89787A">к столу: категория A,</text><text x="156.0" y="625.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#89787A">ровный калибр, чистая</text><text x="156.0" y="660.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#89787A">скорлупа.</text><rect x="547.0" y="250.0" width="399.0" height="640.0" rx="16" fill="#FFFFFF" stroke="#DCD6D5"/><text x="583.0" y="330.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#5E1A26" letter-spacing="2">02</text><text x="583.0" y="430.0" font-family="Josefin Sans, Georgia, serif" font-size="44" font-weight="600" fill="#2B0D14">Происхождение</text><text x="583.0" y="522.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#89787A">Мы знаем каждую</text><text x="583.0" y="556.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#89787A">ферму-партнёра и можем</text><text x="583.0" y="591.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#89787A">рассказать историю любой</text><text x="583.0" y="625.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#89787A">партии.</text><rect x="974.0" y="250.0" width="399.0" height="640.0" rx="16" fill="#FFFFFF" stroke="#DCD6D5"/><text x="1010.0" y="330.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#5E1A26" letter-spacing="2">03</text><text x="1010.0" y="430.0" font-family="Josefin Sans, Georgia, serif" font-size="44" font-weight="600" fill="#2B0D14">Церемония</text><text x="1010.0" y="522.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#89787A">Упаковка, документы и</text><text x="1010.0" y="556.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#89787A">доставка выполнены с тем</text><text x="1010.0" y="591.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#89787A">же вниманием к деталям,</text><text x="1010.0" y="625.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#89787A">что и продукт.</text><rect x="1401.0" y="250.0" width="399.0" height="640.0" rx="16" fill="#FFFFFF" stroke="#DCD6D5"/><text x="1437.0" y="330.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#5E1A26" letter-spacing="2">04</text><text x="1437.0" y="430.0" font-family="Josefin Sans, Georgia, serif" font-size="44" font-weight="600" fill="#2B0D14">Постоянство</text><text x="1437.0" y="522.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#89787A">Дом держит слово:</text><text x="1437.0" y="556.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#89787A">одинаковое качество в</text><text x="1437.0" y="591.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#89787A">первый и в тысячный заказ.</text></svg></section><section id="s04" aria-label="04 Аудитория"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img"><rect width="1920" height="1080" fill="#FBFAF7"/><text x="120.0" y="92.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#89787A" letter-spacing="3">PRIMEEGG · БРЕНДБУК · PE-04.05</text><text x="1800.0" y="92.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#89787A" text-anchor="end" letter-spacing="2">04 / 12</text><text x="120.0" y="196.0" font-family="Josefin Sans, Georgia, serif" font-size="60" font-weight="600" fill="#2B0D14">Аудитория</text><text x="120.0" y="1016.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#89787A">Этикетка Maison</text><text x="1800.0" y="1016.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#89787A" text-anchor="end">Primeegg Distribution SL · 26.11.2026</text><rect x="120.0" y="250.0" width="538.7" height="650.0" rx="16" fill="#5E1A26" stroke="#DCD6D5"/><text x="160.0" y="320.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#D7C6C9" letter-spacing="3">СЕГМЕНТ 1</text><text x="160.0" y="400.0" font-family="Josefin Sans, Georgia, serif" font-size="40" font-weight="600" fill="#FFFFFF">Оптовые покупатели</text><text x="160.0" y="488.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#D7C6C9" letter-spacing="2.5">ЧТО ВАЖНО</text><text x="160.0" y="528.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF">Стабильный премиальный ассортимент с</text><text x="160.0" y="561.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF">прослеживаемостью и маржой выше рынка.</text><text x="160.0" y="628.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#D7C6C9" letter-spacing="2.5">ЧТО МЫ ГОВОРИМ</text><text x="160.0" y="668.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF" font-style="italic">Продукт, который продаёт себя сам:</text><text x="160.0" y="701.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF" font-style="italic">этикетка, история и качество, за</text><text x="160.0" y="734.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF" font-style="italic">которые клиент готов платить.</text><rect x="690.7" y="250.0" width="538.7" height="650.0" rx="16" fill="#FFFFFF" stroke="#DCD6D5"/><text x="730.7" y="320.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#5E1A26" letter-spacing="3">СЕГМЕНТ 2</text><text x="730.7" y="400.0" font-family="Josefin Sans, Georgia, serif" font-size="40" font-weight="600" fill="#2B0D14">HoReCa</text><text x="730.7" y="488.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#89787A" letter-spacing="2.5">ЧТО ВАЖНО</text><text x="730.7" y="528.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#2B0D14">Яйца с ярким желтком и плотным белком,</text><text x="730.7" y="561.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#2B0D14">точные поставки к сервису,</text><text x="730.7" y="594.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#2B0D14">бесперебойность.</text><text x="730.7" y="661.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#89787A" letter-spacing="2.5">ЧТО МЫ ГОВОРИМ</text><text x="730.7" y="701.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#2B0D14" font-style="italic">Ваш шеф получает яйцо уровня вашего</text><text x="730.7" y="734.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#2B0D14" font-style="italic">меню — каждый день, без компромиссов.</text><rect x="1261.3" y="250.0" width="538.7" height="650.0" rx="16" fill="#FFFFFF" stroke="#DCD6D5"/><text x="1301.3" y="320.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#5E1A26" letter-spacing="3">СЕГМЕНТ 3</text><text x="1301.3" y="400.0" font-family="Josefin Sans, Georgia, serif" font-size="40" font-weight="600" fill="#2B0D14">Ретейл и покупатель</text><text x="1301.3" y="488.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#89787A" letter-spacing="2.5">ЧТО ВАЖНО</text><text x="1301.3" y="528.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#2B0D14">Понятный знак качества на полке и повод</text><text x="1301.3" y="561.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#2B0D14">купить к особому столу.</text><text x="1301.3" y="628.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#89787A" letter-spacing="2.5">ЧТО МЫ ГОВОРИМ</text><text x="1301.3" y="668.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#2B0D14" font-style="italic">Небольшая роскошь на каждый день: яйца</text><text x="1301.3" y="701.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#2B0D14" font-style="italic">дома Primeegg.</text></svg></section><section id="s05" aria-label="05 Характер и голос"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img"><rect width="1920" height="1080" fill="#FBFAF7"/><text x="120.0" y="92.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#89787A" letter-spacing="3">PRIMEEGG · БРЕНДБУК · PE-04.05</text><text x="1800.0" y="92.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#89787A" text-anchor="end" letter-spacing="2">05 / 12</text><text x="120.0" y="196.0" font-family="Josefin Sans, Georgia, serif" font-size="60" font-weight="600" fill="#2B0D14">Характер и голос</text><text x="120.0" y="1016.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#89787A">Этикетка Maison</text><text x="1800.0" y="1016.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#89787A" text-anchor="end">Primeegg Distribution SL · 26.11.2026</text><text x="120.0" y="280.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#5E1A26" letter-spacing="3">ХАРАКТЕР</text><rect x="120" y="306" width="206" height="52" rx="26" fill="#ECE4E5"/><text x="223.0" y="340.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#2B0D14" text-anchor="middle">изысканный</text><rect x="340" y="306" width="206" height="52" rx="26" fill="#ECE4E5"/><text x="443.0" y="340.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#2B0D14" text-anchor="middle">сдержанный</text><rect x="560" y="306" width="191" height="52" rx="26" fill="#ECE4E5"/><text x="655.5" y="340.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#2B0D14" text-anchor="middle">уверенный</text><rect x="765" y="306" width="236" height="52" rx="26" fill="#ECE4E5"/><text x="883.0" y="340.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#2B0D14" text-anchor="middle">внимательный</text><rect x="1015" y="306" width="251" height="52" rx="26" fill="#ECE4E5"/><text x="1140.5" y="340.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#2B0D14" text-anchor="middle">гостеприимный</text><text x="120.0" y="440.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#5E1A26" letter-spacing="3">ПРИНЦИПЫ ГОЛОСА</text><text x="120.0" y="490.0" font-family="Josefin Sans, Georgia, serif" font-size="28" font-weight="600" fill="#2B0D14">С достоинством</text><text x="120.0" y="528.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#89787A">Говорим спокойно и без восклицаний: качество не нуждается в</text><text x="120.0" y="559.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#89787A">крике.</text><text x="120.0" y="621.8" font-family="Josefin Sans, Georgia, serif" font-size="28" font-weight="600" fill="#2B0D14">Предметно</text><text x="120.0" y="659.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#89787A">Вместо громких эпитетов — детали: ферма, калибр, день сбора.</text><text x="120.0" y="721.7" font-family="Josefin Sans, Georgia, serif" font-size="28" font-weight="600" fill="#2B0D14">Гостеприимно</text><text x="120.0" y="759.7" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#89787A">Обращаемся к клиенту как сомелье к гостю: на «вы», с уважением и</text><text x="120.0" y="791.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#89787A">готовностью помочь.</text><rect x="1000.0" y="250.0" width="800.0" height="330.0" rx="16" fill="#FFFFFF" stroke="#DCD6D5"/><text x="1036.0" y="300.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1E8E4E" letter-spacing="3">ТАК ГОВОРИМ</text><text x="1036.0" y="350.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#2B0D14">«Seleccionados a mano, granja a granja.»</text><text x="1036.0" y="398.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#2B0D14">«Su pedido llegará mañana antes del servicio.»</text><text x="1036.0" y="447.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#2B0D14">«Un huevo digno de su mesa.»</text><rect x="1000.0" y="610.0" width="800.0" height="300.0" rx="16" fill="#FFFFFF" stroke="#DCD6D5"/><text x="1036.0" y="660.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#C0392B" letter-spacing="3">ТАК НЕ ГОВОРИМ</text><text x="1036.0" y="710.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#89787A">«¡¡Los huevos más baratos del mercado!!»</text><text x="1036.0" y="758.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#89787A">«Ofertón: compra 3 y paga 2.»</text><text x="1036.0" y="807.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#89787A">«Huevos de calidad top, a tope.»</text></svg></section><section id="s06" aria-label="06 Слоганы"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img"><rect width="1920" height="1080" fill="#FBFAF7"/><text x="120.0" y="92.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#89787A" letter-spacing="3">PRIMEEGG · БРЕНДБУК · PE-04.05</text><text x="1800.0" y="92.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#89787A" text-anchor="end" letter-spacing="2">06 / 12</text><text x="120.0" y="196.0" font-family="Josefin Sans, Georgia, serif" font-size="60" font-weight="600" fill="#2B0D14">Слоганы и заголовки</text><text x="120.0" y="1016.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#89787A">Этикетка Maison</text><text x="1800.0" y="1016.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#89787A" text-anchor="end">Primeegg Distribution SL · 26.11.2026</text><rect x="120" y="250" width="1680" heig 350.0" y="512.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#2B0D14">упаковке, обечайке лотка, фоне сайта</text><text x="1350.0" y="547.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#2B0D14">и фартуках персонала.</text><text x="1350.0" y="611.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#89787A">Паттерн — фон, а не герой: под логотипом и</text><text x="1350.0" y="641.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#89787A">текстом на нём всегда есть спокойная</text><text x="1350.0" y="671.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#89787A">плашка. Масштаб — не мельче, чем 1/12</text><text x="1350.0" y="701.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#89787A">ширины носителя.</text></svg></section><section id="s11" aria-label="11 Фотостиль"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img"><rect width="1920" height="1080" fill="#FBFAF7"/><text x="120.0" y="92.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#89787A" letter-spacing="3">PRIMEEGG · БРЕНДБУК · PE-04.05</text><text x="1800.0" y="92.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#89787A" text-anchor="end" letter-spacing="2">11 / 12</text><text x="120.0" y="196.0" font-family="Josefin Sans, Georgia, serif" font-size="60" font-weight="600" fill="#2B0D14">Фотостиль</text><text x="120.0" y="1016.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#89787A">Этикетка Maison</text><text x="1800.0" y="1016.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#89787A" text-anchor="end">Primeegg Distribution SL · 26.11.2026</text><linearGradient id="PE04 0 C22 130 0 110 0 80 C0 45 22 0 50 0 Z" fill="#E8C49A"/><path transform="translate(1009.6,482.0) scale(0.828)" d="M50 0 C78 0 100 45 100 80 C100 110 78 130 50 130 C22 130 0 110 0 80 C0 45 22 0 50 0 Z" fill="#F4EEE3"/><text x="717.3" y="290.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" letter-spacing="3" opacity="0.8">ФОТО</text><text x="689.3" y="720.0" font-family="Josefin Sans, Georgia, serif" font-size="28" font-weight="600" fill="#2B0D14">Отбор на ферме</text><text x="689.3" y="760.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#89787A">Корзина свежих яиц на деревянном столе, руки</text><text x="689.3" y="789.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#89787A">фермера проверяют скорлупу на рассвете.</text><linearGradient id="PE0405ph14" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#756266"/><stop offset="1" stop-color="#200A0F"/></linearGradient><rect x="1258.7" y="250" width="541.3" height="420" rx="16" fill="url(#PE0405ph14)"/><ellipse cx="1529.3" cy="590" rx="194.9" ry="22" fill="#000" opacity="0.18"/><path transform="translate(1396.9,482.0) scale(0.828)" d="M50 0 C78 0 100 45 100 80 C100 110 78 130 50 130 C22 130 0 110 0 80 C0 45 22 0 50 0 Z" fill="#F4EEE3"/><path transform="translate(1476.4,452.0) scale(1.058)" d="M50 0 C78 0 100 45 100 80 C100 110 78 130 50 130 C22 130 0 110 0 80 C0 45 22 0 50 0 Z" fill="#E8C49A"/><path transform="translate(1578.9,482.0) scale(0.828)" d="M50 0 C78 0 100 45 100 80 C100 110 78 130 50 130 C22 130 0 110 0 80 C0 45 22 0 50 0 Z" fill="#F4EEE3"/><text x="1286.7" y="290.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" letter-spacing="3" opacity="0.8">ФОТО</text><text x="1258.7" y="720.0" font-family="Josefin Sans, Georgia, serif" font-size="28" font-weight="600" fill="#2B0D14">Подарочная коробка</text><text x="1258.7" y="760.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#89787A">Открытая коробка с бандеролью «Maison» на льняной</text><text x="1258.7" y="789.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#89787A">скатерти рядом с бокалом и хлебом.</text><text x="120.0" y="880.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#2B0D14">Тёплый боковой свет и глубокие тени, как в натюрморте старых мастеров. · Минимум предметов: яйцо, фактура льна, дерева или камня, ничего лишнего. · Цвет кадра</text><text x="120.0" y="909.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#2B0D14">держится в гамме бордо, слоновой кости и золота.</text></svg></section><section id="s12" aria-label="12 Финал"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img"><rect width="1920" height="1080" fill="#2B0D14"/><clipPath id="PE0405pc15"><rect x="0.0" y="0.0" width="1920.0" height="1080.0" rx="0"/></clipPath><g clip-path="url(#PE0405pc15)"><g opacity="0.12"><g transform="translate(0.0,0.0) scale(1.6000)"><g fill="#FFFFFF"><g transform="translate(60 60) scale(0.7) translate(0 -10)"><path d="M-11 14.8 L-13 5.8 L-5.7 9.4 L0 2.8 L5.7 9.4 L13 5.8 L11 14.8 Z"/><rect x="-11" y="16.3" width="22" height="2"/><circle cx="-13" cy="4.4" r="1.4"/><circle cx="0" cy="1.4" r="1.4"/><circle cx="13" cy="4.4" r="1.4"/></g><g transform="translate(0 0) scale(0.7) translate(0 -10)"><path d="M-11 14.8 L-13 5.8 L-5.7 9.4 L0 2.8 L5.7 9.4 L13 5.8 L11 14.8 Z"/><rect x="-11" y="16.3" width="22" height="2"/><circle cx="-13" cy="4.4" r="1.4"/><circle cx="0" cy="1.4" r="1.4"/><circle cx="13" cy="4.4" r="1.4"/></g><g transform="translate(0 120) scale(0.7) translate(0 -10)"><path d="M-11 14.8 L-13 5.8 L-5.7 9.4 L0 2.8 L5.7 9.4 L13 5.8 L11 14.8 Z"/><rect x="-11" y="16.3" width="22" height="2"/><circle cx="-13" cy="4.4" r="1.4"/><circle cx="0" cy="1.4"
