</g><text x="120.0" y="300.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0B3C5D" letter-spacing="6">ЛОГОБУК</text><text x="120.0" y="400.0" font-family="Montserrat, Georgia, serif" font-size="72" font-weight="600" fill="#0A2A40">Пин доставки</text><text x="120.0" y="460.0" font-family="Montserrat, Georgia, serif" font-size="30" font-weight="400" fill="#768892" font-style="italic">Delivery Pin</text><text x="120.0" y="560.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#0A2A40">Поставщик, который всегда приезжает по адресу.</text><line x1="120" y1="870" x2="878" y2="870" stroke="#D7DBDC" stroke-width="2"/><text x="120.0" y="920.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#0A2A40">Primeegg Distribution SL</text><text x="120.0" y="956.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#768892">Концепт PE-05.01 · версия 1.0 · 26.11.2026</text><text x="120.0" y="92.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#768892" letter-spacing="3">PRIMEEGG · PE-05.01</text></svg></section><section id="s02" aria-label="02 Концепция"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img"><rect width="1920" height="1080" fill="#FBFAF7"/><text x="120.0" y="92.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#768892" letter-spacing="3">PRIMEEGG · ЛОГОБУК · PE-05.01</text><text x="1800.0" y="92.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#768892" text-anchor="end" letter-spacing="2">02 / 12</text><text x="120.0" y="196.0" font-family="Montserrat, Georgia, serif" font-size="60" font-weight="600" fill="#0A2A40">Концепция</text><text x="120.0" y="1016.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#768892">Пин доставки</text><text x="1800.0" y="1016.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#768892" text-anchor="end">Primeegg Distribution SL · 26.11.2026</text><text x="120.0" y="300.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0A2A40">Яйцо, перевёрнутое широкой частью вверх, превращается в</text><text x="120.0" y="340.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0A2A40">метку на карте, а желток — в кольцо точки назначения. Под</text><text x="120.0" y="380.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0A2A40">меткой лежит мягкая тень: пин «встал» на адрес клиента.</text><text x="120.0" y="420.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0A2A40">Один простой силуэт одновременно говорит о продукте и о</text><text x="120.0" y="461.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0A2A40">логистике.</text><text x="120.0" y="531.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0A2A40">Для дистрибьютора главное обещание — надёжность поставок, и</text><text x="120.0" y="571.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0A2A40">знак формулирует его без слов. Строгий навигационный синий</text><text x="120.0" y="612.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0A2A40">и плотный гротеск Montserrat читаются как корпоративный</text><text x="120.0" y="652.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0A2A40">B2B-стиль, уместный в коммерческом предложении для HoReCa,</text><text x="120.0" y="692.7" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0A2A40">на борту грузовика и в накладной. Тёплый желток добавляет</text><text x="120.0" y="733.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0A2A40">узнаваемости на полке и в приложении доставки, а компактный</text><text x="120.0" y="773.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0A2A40">знак работает как фавикон и штамп на коробке.</text><rect x="1080" y="250" width="720" height="320" rx="16" fill="#FFFFFF" stroke="#D7DBDC"/><g transform="translate(1305.00,275.00) scale(1.3500)">
<g transform="translate(47 17.85) scale(1.06)"><ellipse cx="50" cy="149" rx="28" ry="6" fill="#0B3C5D" fill-opacity="0.22"/><path d="M50 130 C78 130 100 85 100 50 C100 20 78 0 50 0 C22 0 0 20 0 50 C0 85 22 130 50 130 Z" fill="#0B3C5D"/><circle cx="50" cy="50" r="24" fill="#F2B705"/><circle cx="50" cy="50" r="8" fill="#0B3C5D"/></g>
</g><text x="1080.0" y="630.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0B3C5D" letter-spacing="3">ЭЛЕМЕНТЫ ЗНАКА</text><text x="1080.0" y="676.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#0A2A40">Перевёрнутое яйцо</text><text x="1350.0" y="676.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#768892">продукт и одновременно метка на карте —</text><text x="1350.0" y="706.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#768892">доставка точно по адресу</text><text x="1080.0" y="758.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#0A2A40">Желток-кольцо с</text><text x="1080.0" y="788.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#0A2A40">точкой</text><text x="1350.0" y="758.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#768892">точка назначения, свежесть и тепло</text><text x="1350.0" y="788.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#768892">продукта</text><text x="1080.0" y="840.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#0A2A40">Тень под пином</text><text x="1350.0" y="840.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#768892">заказ доставлен: метка стоит на земле, у</text><text x="1350.0" y="870.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#768892">клиента</text><text x="1080.0" y="922.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#0A2A40">Жёлтая линия над</text><text x="1080.0" y="952.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#0A2A40">названием</text><text x="1350.0" y="922.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#768892">маршрут и ритм поставок; акцент,</text><text x="1350.0" y="952.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#768892">связывающий знак и надпись</text></svg></section><section id="s03" aria-label="03 Основной логотип"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img"><rect width="1920" height="1080" fill="#FBFAF7"/><text x="120.0" y="92.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#768892" letter-spacing="3">PRIMEEGG · ЛОГОБУК · PE-05.01</text><text x="1800.0" y="92.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#768892" text-anchor="end" letter-spacing="2">03 / 12</text><text x="120.0" y="196.0" font-family="Montserrat, Georgia, serif" font-size="60" font-weight="600" fill="#0A2A40">Основной логотип</text><text x="120.0" y="1016.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#768892">Пин доставки</text><text x="1800.0" y="1016.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#768892" text-anchor="end">Primeegg Distribution SL · 26.11.2026</text><rect x="120" y="250" width="1680" height="640" rx="16" fill="#FFFFFF" stroke="#D7DBDC"/><g transform="translate(573.33,280.00) scale(1.9333)">
