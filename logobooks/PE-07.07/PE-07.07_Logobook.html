xt x="1800.0" y="1016.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#76908F" text-anchor="end">Primeegg Distribution SL · 26.11.2026</text><text x="120.0" y="300.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0A3A3A">Логотип — ретро-скрипт Lobster, в котором «Prime» набрано</text><text x="120.0" y="340.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0A3A3A">глубоким бирюзовым, а «egg» — тёплым янтарным. В конце</text><text x="120.0" y="380.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0A3A3A">слова вместо точки стоит яйцо: название превращается в</text><text x="120.0" y="420.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0A3A3A">утверждение «Primeegg.». Плавный росчерк-подчёркивание и</text><text x="120.0" y="461.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0A3A3A">строка «Since 2026 · España» добавляют интонацию фирменной</text><text x="120.0" y="501.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0A3A3A">вывески. Производный знак — монограмма «P» с яйцом-точкой в</text><text x="120.0" y="541.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0A3A3A">бирюзовом круге — напрямую вытекает из надписи.</text><text x="120.0" y="612.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0A3A3A">Яйцо-точка — простой и запоминаемый ход: он говорит о</text><text x="120.0" y="652.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0A3A3A">продукте без иллюстрации и уверенно звучит в</text><text x="120.0" y="692.7" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0A3A3A">B2B-коммуникации — в прайсах, на паллетах и в документах.</text><text x="120.0" y="733.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0A3A3A">Бирюза и янтарь отсылают к средиземноморскому морю и</text><text x="120.0" y="773.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0A3A3A">желтку, отличают бренд на полке от привычных красно-жёлтых</text><text x="120.0" y="813.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0A3A3A">упаковок, а круглая монограмма работает как фавикон, штамп</text><text x="120.0" y="853.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0A3A3A">на коробке и аватар.</text><rect x="1080" y="250" width="720" height="320" rx="16" fill="#FFFFFF" stroke="#D7DDDB"/><g transform="translate(1305.00,275.00) scale(1.3500)">
