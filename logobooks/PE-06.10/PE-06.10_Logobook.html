xt><text x="120.0" y="1016.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#848B9A">Яйцо на связи</text><text x="1800.0" y="1016.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#848B9A" text-anchor="end">Primeegg Distribution SL · 26.11.2026</text><text x="120.0" y="300.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#22304D">Знак — яйцо, превращённое в пузырь чата: хвостик-выноска</text><text x="120.0" y="340.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#22304D">снизу слева и «многоточие» из трёх маленьких яиц, будто</text><text x="120.0" y="380.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#22304D">собеседник уже набирает ответ. Последнее яйцо окрашено в</text><text x="120.0" y="420.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#22304D">цвет желтка — это точка, в которой разговор превращается в</text><text x="120.0" y="461.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#22304D">поставку.</text><text x="120.0" y="531.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#22304D">Для B2B-клиента главное — надёжность и скорость реакции:</text><text x="120.0" y="571.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#22304D">знак прямо обещает, что Primeegg отвечает на заказ и держит</text><text x="120.0" y="612.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#22304D">связь с кухнями HoReCa, оптовиками и производствами.</text><text x="120.0" y="652.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#22304D">Округлый Nunito Black читается на картоне и в мелком кегле,</text><text x="120.0" y="692.7" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#22304D">а знак-пузырь естественно работает как иконка приложения,</text><text x="120.0" y="733.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#22304D">аватар в мессенджере и кнопка заказа на сайте.</text><rect x="1080" y="250" width="720" height="320" rx="16" fill="#FFFFFF" stroke="#DADCDE"/><g transform="translate(1305.00,275.00) scale(1.3500)">
