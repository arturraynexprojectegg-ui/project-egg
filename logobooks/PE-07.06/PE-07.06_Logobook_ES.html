</g><text x="120.0" y="300.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#C8102E" letter-spacing="6">MANUAL DE LOGOTIPO</text><text x="120.0" y="400.0" font-family="Fraunces, Georgia, serif" font-size="72" font-weight="600" fill="#2A1215">Sol de huevo</text><text x="120.0" y="484.0" font-family="Fraunces, Georgia, serif" font-size="72" font-weight="600" fill="#2A1215">frito</text><text x="120.0" y="544.0" font-family="Fraunces, Georgia, serif" font-size="30" font-weight="400" fill="#887A7B" font-style="italic">Sunny-Side Sun</text><text x="120.0" y="644.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#2A1215">El cálido carácter español del huevo fresco, de</text><text x="120.0" y="687.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#2A1215">la cocina del restaurante al lineal de la tienda.</text><line x1="120" y1="870" x2="878" y2="870" stroke="#DCD7D5" stroke-width="2"/><text x="120.0" y="920.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#2A1215">Primeegg Distribution SL</text><text x="120.0" y="956.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#887A7B">Concepto PE-07.06 · versión 1.0 · 26.11.2026</text><text x="120.0" y="92.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#887A7B" letter-spacing="3">PRIMEEGG · PE-07.06</text></svg></section><section id="s02" aria-label="02 Concepto"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img"><rect width="1920" height="1080" fill="#FBFAF7"/><text x="120.0" y="92.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#887A7B" letter-spacing="3">PRIMEEGG · MANUAL DE LOGOTIPO · PE-07.06</text><text x="1800.0" y="92.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#887A7B" text-anchor="end" letter-spacing="2">02 / 12</text><text x="120.0" y="196.0" font-family="Fraunces, Georgia, serif" font-size="60" font-weight="600" fill="#2A1215">Concepto</text><text x="120.0" y="1016.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#887A7B">Sol de huevo frito</text><text x="1800.0" y="1016.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#887A7B" text-anchor="end">Primeegg Distribution SL · 26.11.2026</text><text x="120.0" y="300.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#2A1215">El símbolo es un huevo frito dibujado con un trazo vivo y</text><text x="120.0" y="340.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#2A1215">algo irregular: la clara va perfilada en rojo y la yema</text><text x="120.0" y="380.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#2A1215">amarilla con su brillo se lee como el sol mediterráneo del</text><text x="120.0" y="420.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#2A1215">mediodía. A su lado, «Primeegg» manuscrito en Yellowtail y</text><text x="120.0" y="461.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#2A1215">el sobrio descriptor «Huevos · Ovoproductos» en Montserrat,</text><text x="120.0" y="501.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#2A1215">que equilibra la emoción del script con un tono</text><text x="120.0" y="541.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#2A1215">profesional.</text><text x="120.0" y="612.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#2A1215">El rojo y el amarillo son los colores de España y del</text><text x="120.0" y="652.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#2A1215">apetito, y se reconocen al instante en el estuche de</text><text x="120.0" y="692.7" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#2A1215">huevos, la etiqueta y la carta. Para HoReCa, el símbolo</text><text x="120.0" y="733.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#2A1215">habla el idioma del plato terminado; en retail crea un</text><text x="120.0" y="773.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#2A1215">lineal vivo y cercano, y el descriptor de ovoproductos</text><text x="120.0" y="813.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#2A1215">mantiene la seriedad B2B. El huevo frito funciona por sí</text><text x="120.0" y="853.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#2A1215">solo como icono, sello y favicon.</text><rect x="1080" y="250" width="720" height="320" rx="16" fill="#FFFFFF" stroke="#DCD7D5"/><g transform="translate(1305.00,275.00) scale(1.3500)">

</g><text x="1080.0" y="630.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#C8102E" letter-spacing="3">ELEMENTOS DEL SÍMBOLO</text><text x="1080.0" y="676.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#2A1215">Huevo frito</text><text x="1350.0" y="676.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#887A7B">el producto en su forma más reconocible:</text><text x="1350.0" y="706.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#887A7B">frescura y listo para cocinar</text><text x="1080.0" y="758.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#2A1215">Yema-sol</text><text x="1350.0" y="758.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#887A7B">Mediterráneo, calidez, calidad «prime»</text><text x="1080.0" y="810.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#2A1215">Tipografía</text><text x="1080.0" y="840.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#2A1215">manuscrita</text><text x="1350.0" y="810.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#887A7B">sinceridad de granja, la voz humana de</text><text x="1350.0" y="840.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#887A7B">la marca</text><text x="1080.0" y="892.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#2A1215">Descriptor Huevos</text><text x="1080.0" y="922.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#2A1215">· Ovoproductos</text><text x="1350.0" y="892.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#887A7B">posicionamiento B2B claro: huevos y</text><text x="1350.0" y="922.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#887A7B">ovoproductos</text></svg></section><section id="s03" aria-label="03 Logotipo principal"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img"><rect width="1920" height="1080" fill="#FBFAF7"/><text x="120.0" y="92.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#887A7B" letter-spacing="3">PRIMEEGG · MANUAL DE LOGOTIPO · PE-07.06</text><text x="1800.0" y="92.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#887A7B" text-anchor="end" letter-spacing="2">03 / 12</text><text x="120.0" y="196.0" font-family="Fraunces, Georgia, serif" font-size="60" font-weight="600" fill="#2A1215">Logotipo principal</text><text x="120.0" y="1016.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#887A7B">Sol de huevo frito</text><text x="1800.0" y="1016.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#887A7B" text-anchor="end">Primeegg Distribution SL · 26.11.2026</text><rect x="120" y="250" width="1680" height="640" rx="16" fill="#FFFFFF" stroke="#DCD7D5"/><g transform="translate(573.33,280.00) scale(1.9333)">
