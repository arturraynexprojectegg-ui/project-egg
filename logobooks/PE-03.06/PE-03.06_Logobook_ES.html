</g><text x="120.0" y="300.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1F4E9C" letter-spacing="6">MANUAL DE LOGOTIPO</text><text x="120.0" y="400.0" font-family="DM Serif Display, Georgia, serif" font-size="72" font-weight="600" fill="#0E2140">Sello</text><text x="120.0" y="460.0" font-family="DM Serif Display, Georgia, serif" font-size="30" font-weight="400" fill="#798392" font-style="italic">Sello</text><text x="120.0" y="560.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#0E2140">Un sello mediterráneo de calidad: cerámica, sol y</text><text x="120.0" y="603.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#0E2140">un huevo de granja honesto.</text><line x1="120" y1="870" x2="878" y2="870" stroke="#D7D9DC" stroke-width="2"/><text x="120.0" y="920.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#0E2140">Primeegg Distribution SL</text><text x="120.0" y="956.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#798392">Concepto PE-03.06 · versión 1.0 · 26.11.2026</text><text x="120.0" y="92.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#798392" letter-spacing="3">PRIMEEGG · PE-03.06</text></svg></section><section id="s02" aria-label="02 Concepto"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img"><rect width="1920" height="1080" fill="#FBFAF7"/><text x="120.0" y="92.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#798392" letter-spacing="3">PRIMEEGG · MANUAL DE LOGOTIPO · PE-03.06</text><text x="1800.0" y="92.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#798392" text-anchor="end" letter-spacing="2">02 / 12</text><text x="120.0" y="196.0" font-family="DM Serif Display, Georgia, serif" font-size="60" font-weight="600" fill="#0E2140">Concepto</text><text x="120.0" y="1016.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#798392">Sello</text><text x="1800.0" y="1016.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#798392" text-anchor="end">Primeegg Distribution SL · 26.11.2026</text><text x="120.0" y="300.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0E2140">El símbolo es un sello-medallón redondo en azul cobalto con</text><text x="120.0" y="340.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0E2140">orla de cuentas, como la decoración de un plato de cerámica</text><text x="120.0" y="380.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0E2140">española. En el centro, un huevo terracota con yema</text><text x="120.0" y="420.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0E2140">azafrán; encima, una cinta terracota con el nombre PRIMEEGG</text><text x="120.0" y="461.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0E2140">en DM Serif Display; en arco, «HUEVOS DE GRANJA» y «ESPAÑA</text><text x="120.0" y="501.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0E2140">· 2026» en la geométrica Josefin Sans. El símbolo</text><text x="120.0" y="541.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0E2140">independiente es el mismo medallón con el huevo y sin</text><text x="120.0" y="582.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0E2140">texto: la orla, las cuentas y la yema mantienen el</text><text x="120.0" y="622.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0E2140">reconocimiento hasta los 16 px.</text><text x="120.0" y="692.7" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0E2140">El sello se lee al instante como un certificado: para el</text><text x="120.0" y="733.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0E2140">comprador de HoReCa y el mayorista es señal de origen</text><text x="120.0" y="773.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0E2140">verificado y calidad estable; para el consumidor en tienda,</text><text x="120.0" y="813.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0E2140">un cálido carácter mediterráneo sin folclore recargado. El</text><text x="120.0" y="853.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0E2140">medallón se adapta con naturalidad a la tapa del estuche de</text><text x="120.0" y="894.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0E2140">huevos, al saco de huevo en polvo y a la pegatina de lacre;</text><text x="120.0" y="934.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0E2140">la cinta con el nombre funciona por separado como logotipo</text><text x="120.0" y="974.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0E2140">en etiquetas y rótulos. La versión a una tinta se construye</text><text x="120.0" y="1015.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0E2140">con calados y se imprime con sello sobre cartón.</text><rect x="1080" y="250" width="720" height="320" rx="16" fill="#FFFFFF" stroke="#D7D9DC"/><g transform="translate(1305.00,275.00) scale(1.3500)">

</g><text x="1080.0" y="630.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F4E9C" letter-spacing="3">ELEMENTOS DEL SÍMBOLO</text><text x="1080.0" y="676.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#0E2140">Medallón cobalto</text><text x="1080.0" y="706.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#0E2140">con cuentas</text><text x="1350.0" y="676.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#798392">la cerámica española y el sello de</text><text x="1350.0" y="706.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#798392">calidad</text><text x="1080.0" y="758.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#0E2140">Huevo terracota</text><text x="1080.0" y="788.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#0E2140">con yema</text><text x="1350.0" y="758.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#798392">el producto y la frescura; el azafrán es</text><text x="1350.0" y="788.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#798392">el sol del Mediterráneo</text><text x="1080.0" y="840.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#0E2140">Cinta con el</text><text x="1080.0" y="870.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#0E2140">nombre</text><text x="1350.0" y="840.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#798392">distintivo, «galardón» de calidad; se</text><text x="1350.0" y="870.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#798392">usa por separado como logotipo</text><text x="1080.0" y="922.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#0E2140">Textos en arco</text><text x="1350.0" y="922.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#798392">el origen de granja y España como</text><text x="1350.0" y="952.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#798392">garantía</text></svg></section><section id="s03" aria-label="03 Logotipo principal"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img"><rect width="1920" height="1080" fill="#FBFAF7"/><text x="120.0" y="92.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#798392" letter-spacing="3">PRIMEEGG · MANUAL DE LOGOTIPO · PE-03.06</text><text x="1800.0" y="92.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#798392" text-anchor="end" letter-spacing="2">03 / 12</text><text x="120.0" y="196.0" font-family="DM Serif Display, Georgia, serif" font-size="60" font-weight="600" fill="#0E2140">Logotipo principal</text><text x="120.0" y="1016.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#798392">Sello</text><text x="1800.0" y="1016.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#798392" text-anchor="end">Primeegg Distribution SL · 26.11.2026</text><rect x="120" y="250" width="1680" height="640" rx="16" fill="#FFFFFF" stroke="#D7D9DC"/><g transform="translate(573.33,280.00) scale(1.9333)">
