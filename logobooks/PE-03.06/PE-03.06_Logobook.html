</g><text x="120.0" y="300.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1F4E9C" letter-spacing="6">ЛОГОБУК</text><text x="120.0" y="400.0" font-family="DM Serif Display, Georgia, serif" font-size="72" font-weight="600" fill="#0E2140">Сельо</text><text x="120.0" y="460.0" font-family="DM Serif Display, Georgia, serif" font-size="30" font-weight="400" fill="#798392" font-style="italic">Sello</text><text x="120.0" y="560.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#0E2140">Средиземноморская печать качества: керамика,</text><text x="120.0" y="603.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#0E2140">солнце и честное яйцо с фермы.</text><line x1="120" y1="870" x2="878" y2="870" stroke="#D7D9DC" stroke-width="2"/><text x="120.0" y="920.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#0E2140">Primeegg Distribution SL</text><text x="120.0" y="956.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#798392">Концепт PE-03.06 · версия 1.0 · 26.11.2026</text><text x="120.0" y="92.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#798392" letter-spacing="3">PRIMEEGG · PE-03.06</text></svg></section><section id="s02" aria-label="02 Концепция"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img"><rect width="1920" height="1080" fill="#FBFAF7"/><text x="120.0" y="92.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#798392" letter-spacing="3">PRIMEEGG · ЛОГОБУК · PE-03.06</text><text x="1800.0" y="92.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#798392" text-anchor="end" letter-spacing="2">02 / 12</text><text x="120.0" y="196.0" font-family="DM Serif Display, Georgia, serif" font-size="60" font-weight="600" fill="#0E2140">Концепция</text><text x="120.0" y="1016.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#798392">Сельо</text><text x="1800.0" y="1016.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#798392" text-anchor="end">Primeegg Distribution SL · 26.11.2026</text><text x="120.0" y="300.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0E2140">Знак — круглая печать-медальон (исп. sello) в кобальте с</text><text x="120.0" y="340.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0E2140">бусинной каймой, как роспись на испанской керамической</text><text x="120.0" y="380.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0E2140">тарелке. В центре терракотовое яйцо с шафрановым желтком,</text><text x="120.0" y="420.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0E2140">поверх — терракотовая лента с названием PRIMEEGG в DM Serif</text><text x="120.0" y="461.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0E2140">Display, по дуге — «HUEVOS DE GRANJA» и «ESPAÑA · 2026»</text><text x="120.0" y="501.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0E2140">геометрическим Josefin Sans. Отдельный знак — тот же</text><text x="120.0" y="541.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0E2140">медальон с яйцом без текста: кайма, бусины и желток</text><text x="120.0" y="582.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0E2140">сохраняют узнаваемость вплоть до 16 px.</text><text x="120.0" y="652.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0E2140">Печать сразу считывается как сертификат: для закупщика</text><text x="120.0" y="692.7" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0E2140">HoReCa и оптовика это сигнал проверенного происхождения и</text><text x="120.0" y="733.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0E2140">стабильного качества, для покупателя в магазине — тёплый</text><text x="120.0" y="773.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0E2140">средиземноморский характер без фольклорной пестроты.</text><text x="120.0" y="813.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0E2140">Медальон естественно ложится на крышку коробки для яиц,</text><text x="120.0" y="853.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0E2140">мешок порошка и сургучную наклейку; лента с названием</text><text x="120.0" y="894.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0E2140">работает отдельно как логотип на этикетке и вывеске.</text><text x="120.0" y="934.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0E2140">Одноцветная версия построена вырезами и печатается штампом</text><text x="120.0" y="974.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0E2140">на картоне.</text><rect x="1080" y="250" width="720" height="320" rx="16" fill="#FFFFFF" stroke="#D7D9DC"/><g transform="translate(1305.00,275.00) scale(1.3500)">
