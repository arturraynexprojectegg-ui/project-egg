</g><text x="120.0" y="300.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#24402A" letter-spacing="6">ЛОГОБУК</text><text x="120.0" y="400.0" font-family="Oswald, Georgia, serif" font-size="72" font-weight="600" fill="#1E2420">Ящичный трафарет</text><text x="120.0" y="460.0" font-family="Oswald, Georgia, serif" font-size="30" font-weight="400" fill="#818481" font-style="italic">Crate Stencil</text><text x="120.0" y="560.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1E2420">Знак, который ставят на ящик: сорт, происхождение</text><text x="120.0" y="603.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1E2420">и имя поставщика в одном штампе.</text><line x1="120" y1="870" x2="878" y2="870" stroke="#DADAD7" stroke-width="2"/><text x="120.0" y="920.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#1E2420">Primeegg Distribution SL</text><text x="120.0" y="956.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#818481">Концепт PE-02.06 · версия 1.0 · 26.11.2026</text><text x="120.0" y="92.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#818481" letter-spacing="3">PRIMEEGG · PE-02.06</text></svg></section><section id="s02" aria-label="02 Концепция"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img"><rect width="1920" height="1080" fill="#FBFAF7"/><text x="120.0" y="92.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#818481" letter-spacing="3">PRIMEEGG · ЛОГОБУК · PE-02.06</text><text x="1800.0" y="92.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#818481" text-anchor="end" letter-spacing="2">02 / 12</text><text x="120.0" y="196.0" font-family="Oswald, Georgia, serif" font-size="60" font-weight="600" fill="#1E2420">Концепция</text><text x="120.0" y="1016.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#818481">Ящичный трафарет</text><text x="1800.0" y="1016.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#818481" text-anchor="end">Primeegg Distribution SL · 26.11.2026</text><text x="120.0" y="300.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1E2420">Логотип построен как трафаретный штамп на деревянном ящике</text><text x="120.0" y="340.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1E2420">или гофрокоробе: двойная рамка со срезанными углами,</text><text x="120.0" y="380.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1E2420">крупное имя PRIMEEGG узким гротеском Bebas Neue и две</text><text x="120.0" y="420.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1E2420">служебные строки — «GRADE A · FARM FRESH» сверху и</text><text x="120.0" y="461.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1E2420">«DISTRIBUTION · ESPAÑA · EST. 2026» снизу. Все строки</text><text x="120.0" y="501.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1E2420">выровнены по одной ширине, как набор на маркировочной</text><text x="120.0" y="541.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1E2420">плашке; два маленьких яйца по краям верхней строки —</text><text x="120.0" y="582.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1E2420">единственная иллюстрация. Отдельный знак — тот же ящик с</text><text x="120.0" y="622.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1E2420">яйцом внутри: рамка и срезанные углы взяты прямо из штампа.</text><text x="120.0" y="692.7" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1E2420">Для B2B это самый практичный язык: так маркируют тару,</text><text x="120.0" y="733.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1E2420">паллеты и накладные, поэтому логотип выглядит как гарантия</text><text x="120.0" y="773.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1E2420">сорта и поставки, а не как реклама. Знак одноцветный по</text><text x="120.0" y="813.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1E2420">своей природе — он без потерь печатается флексографией на</text><text x="120.0" y="853.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1E2420">крафт-картоне, штампуется на мешках яичного порошка и</text><text x="120.0" y="894.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1E2420">ставится на скорлупу. На полке ретейла трафарет считывается</text><text x="120.0" y="934.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1E2420">как «настоящий фермерский продукт без посредников».</text><rect x="1080" y="250" width="720" height="320" rx="16" fill="#FFFFFF" stroke="#DADAD7"/><g transform="translate(1305.00,275.00) scale(1.3500)">

</g><text x="1080.0" y="630.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#24402A" letter-spacing="3">ЭЛЕМЕНТЫ ЗНАКА</text><text x="1080.0" y="676.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#1E2420">Двойная рамка со</text><text x="1080.0" y="706.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#1E2420">срезанными углами</text><text x="1350.0" y="676.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#818481">ящик, тара, надёжная поставка; задаёт</text><text x="1350.0" y="706.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#818481">форму знака</text><text x="1080.0" y="758.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#1E2420">PRIMEEGG узким</text><text x="1080.0" y="788.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#1E2420">гротеском</text><text x="1350.0" y="758.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#818481">трафаретная маркировка: крупно, честно,</text><text x="1350.0" y="788.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#818481">читается издалека</text><text x="1080.0" y="840.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#1E2420">GRADE A · FARM</text><text x="1080.0" y="870.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#1E2420">FRESH</text><text x="1350.0" y="840.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#818481">сорт и свежесть — то, что проверяет</text><text x="1350.0" y="870.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#818481">закупщик</text><text x="1080.0" y="922.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#1E2420">Яйцо</text><text x="1350.0" y="922.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#818481">продукт; в знаке — яйцо внутри ящика,</text><text x="1350.0" y="952.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#818481">суть дистрибуции</text></svg></section><section id="s03" aria-label="03 Основной логотип"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img"><rect width="1920" height="1080" fill="#FBFAF7"/><text x="120.0" y="92.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#818481" letter-spacing="3">PRIMEEGG · ЛОГОБУК · PE-02.06</text><text x="1800.0" y="92.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#818481" text-anchor="end" letter-spacing="2">03 / 12</text><text x="120.0" y="196.0" font-family="Oswald, Georgia, serif" font-size="60" font-weight="600" fill="#1E2420">Основной логотип</text><text x="120.0" y="1016.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#818481">Ящичный трафарет</text><text x="1800.0" y="1016.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#818481" text-anchor="end">Primeegg Distribution SL · 26.11.2026</text><rect x="120" y="250" width="1680" height="640" rx="16" fill="#FFFFFF" stroke="#DADAD7"/><g transform="translate(573.33,280.00) scale(1.9333)">
