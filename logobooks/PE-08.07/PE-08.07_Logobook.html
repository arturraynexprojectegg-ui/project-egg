<text x="120.0" y="1016.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#808A82">Яйцо-лист</text><text x="1800.0" y="1016.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#808A82" text-anchor="end">Primeegg Distribution SL · 26.11.2026</text><text x="120.0" y="300.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1C2E22">Знак — силуэт яйца, который одновременно читается как лист:</text><text x="120.0" y="340.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1C2E22">центральная жилка, пять боковых и короткий черенок</text><text x="120.0" y="380.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1C2E22">превращают форму продукта в образ живого растения. Яйцо и</text><text x="120.0" y="420.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1C2E22">лист складываются в одну фигуру без компромиссов — ни один</text><text x="120.0" y="461.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1C2E22">из образов не теряется.</text><text x="120.0" y="531.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1C2E22">Плотная заливка и мягкий округлый шрифт делают логотип</text><text x="120.0" y="571.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1C2E22">тёплым и честным, а не «аптечным». Для B2B и HoReCa он</text><text x="120.0" y="612.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1C2E22">сигнализирует о натуральном происхождении и прозрачной</text><text x="120.0" y="652.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1C2E22">цепочке «ферма — кухня», на полке ретейла выделяется</text><text x="120.0" y="692.7" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1C2E22">спокойной природной палитрой. Силуэт сохраняется в штампе</text><text x="120.0" y="733.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1C2E22">на картоне и в favicon 16 px, а жилки в одноцветной версии</text><text x="120.0" y="773.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1C2E22">делаются вырезом — знак не требует второго цвета.</text><rect x="1080" y="250" width="720" height="320" rx="16" fill="#FFFFFF" stroke="#DADBD7"/><g transform="translate(1305.00,275.00) scale(1.3500)">

 пафоса</text></svg></section><section id="s03" aria-label="03 Основной логотип"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img"><rect width="1920" height="1080" fill="#FBFAF7"/><text x="120.0" y="92.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#808A82" letter-spacing="3">PRIMEEGG · ЛОГОБУК · PE-08.07</text><text x="1800.0" y="92.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#808A82" text-anchor="end" letter-spacing="2">03 / 12</text><text x="120.0" y="196.0" font-family="Fraunces, Georgia, serif" font-size="60" font-weight="600" fill="#1C2E22">Основной логотип</text><text x="120.0" y="1016.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#808A82">Яйцо-лист</text><text x="1800.0" y="1016.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#808A82" text-anchor="end">Primeegg Distribution SL · 26.11.2026</text><rect x="120" y="250" width="1680" height="640" rx="16" fill="#FFFFFF" stroke="#DADBD7"/><g transform="translate(573.33,280.00) scale(1.9333)">
