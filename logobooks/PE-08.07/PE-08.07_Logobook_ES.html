</g><text x="120.0" y="300.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#2F5D3A" letter-spacing="6">MANUAL DE LOGOTIPO</text><text x="120.0" y="400.0" font-family="Fraunces, Georgia, serif" font-size="72" font-weight="600" fill="#1C2E22">Huevo hoja</text><text x="120.0" y="460.0" font-family="Fraunces, Georgia, serif" font-size="30" font-weight="400" fill="#808A82" font-style="italic">Egg Leaf</text><text x="120.0" y="560.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1C2E22">Un huevo que nace de la naturaleza: producto de</text><text x="120.0" y="603.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1C2E22">granja, sin más palabras.</text><line x1="120" y1="870" x2="878" y2="870" stroke="#DADBD7" stroke-width="2"/><text x="120.0" y="920.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#1C2E22">Primeegg Distribution SL</text><text x="120.0" y="956.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#808A82">Concepto PE-08.07 · versión 1.0 · 26.11.2026</text><text x="120.0" y="92.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#808A82" letter-spacing="3">PRIMEEGG · PE-08.07</text></svg></section><section id="s02" aria-label="02 Concepto"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img"><rect width="1920" height="1080" fill="#FBFAF7"/><text x="120.0" y="92.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#808A82" letter-spacing="3">PRIMEEGG · MANUAL DE LOGOTIPO · PE-08.07</text><text x="1800.0" y="92.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#808A82" text-anchor="end" letter-spacing="2">02 / 12</text><text x="120.0" y="196.0" font-family="Fraunces, Georgia, serif" font-size="60" font-weight="600" fill="#1C2E22">Concepto</text><text x="120.0" y="1016.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#808A82">Huevo hoja</text><text x="1800.0" y="1016.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#808A82" text-anchor="end">Primeegg Distribution SL · 26.11.2026</text><text x="120.0" y="300.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1C2E22">El símbolo es la silueta de un huevo que se lee a la vez</text><text x="120.0" y="340.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1C2E22">como una hoja: el nervio central, cinco laterales y un</text><text x="120.0" y="380.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1C2E22">pecíolo corto convierten la forma del producto en la imagen</text><text x="120.0" y="420.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1C2E22">de una planta viva. Huevo y hoja se funden en una sola</text><text x="120.0" y="461.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1C2E22">figura sin concesiones: ninguna de las dos imágenes se</text><text x="120.0" y="501.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1C2E22">pierde.</text><text x="120.0" y="571.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1C2E22">El relleno sólido y la tipografía suave y redondeada hacen</text><text x="120.0" y="612.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1C2E22">que el logotipo resulte cálido y honesto, nada «de</text><text x="120.0" y="652.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1C2E22">farmacia». En B2B y HoReCa transmite origen natural y una</text><text x="120.0" y="692.7" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1C2E22">cadena transparente «de la granja a la cocina»; en el</text><text x="120.0" y="733.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1C2E22">lineal de retail destaca por su paleta serena y natural. La</text><text x="120.0" y="773.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1C2E22">silueta se mantiene en el sello sobre cartón y en el</text><text x="120.0" y="813.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1C2E22">favicon de 16 px, y en la versión monocroma los nervios se</text><text x="120.0" y="853.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1C2E22">resuelven calados: el símbolo no necesita un segundo color.</text><rect x="1080" y="250" width="720" height="320" rx="16" fill="#FFFFFF" stroke="#DADBD7"/><g transform="translate(1305.00,275.00) scale(1.3500)">

</g><text x="1080.0" y="630.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2F5D3A" letter-spacing="3">ELEMENTOS DEL SÍMBOLO</text><text x="1080.0" y="676.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#1C2E22">Silueta de huevo</text><text x="1350.0" y="676.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#808A82">el producto principal, la forma de la</text><text x="1350.0" y="706.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#808A82">marca Primeegg</text><text x="1080.0" y="758.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#1C2E22">Nervios de la</text><text x="1080.0" y="788.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#1C2E22">hoja</text><text x="1350.0" y="758.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#808A82">naturaleza viva, origen de granja y</text><text x="1350.0" y="788.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#808A82">ecológico</text><text x="1080.0" y="840.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#1C2E22">Pecíolo</text><text x="1350.0" y="840.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#808A82">vínculo con la tierra y el lugar de</text><text x="1350.0" y="870.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#808A82">producción, «recién cogido»: frescura</text><text x="1080.0" y="922.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#1C2E22">Minúsculas</text><text x="1080.0" y="952.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#1C2E22">redondeadas</text><text x="1350.0" y="922.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#808A82">cercanía, apertura, sencillez sin</text><text x="1350.0" y="952.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#808A82">grandilocuencia</text></svg></section><section id="s03" aria-label="03 Logotipo principal"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img"><rect width="1920" height="1080" fill="#FBFAF7"/><text x="120.0" y="92.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#808A82" letter-spacing="3">PRIMEEGG · MANUAL DE LOGOTIPO · PE-08.07</text><text x="1800.0" y="92.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#808A82" text-anchor="end" letter-spacing="2">03 / 12</text><text x="120.0" y="196.0" font-family="Fraunces, Georgia, serif" font-size="60" font-weight="600" fill="#1C2E22">Logotipo principal</text><text x="120.0" y="1016.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#808A82">Huevo hoja</text><text x="1800.0" y="1016.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#808A82" text-anchor="end">Primeegg Distribution SL · 26.11.2026</text><rect x="120" y="250" width="1680" height="640" rx="16" fill="#FFFFFF" stroke="#DADBD7"/><g transform="translate(573.33,280.00) scale(1.9333)">
