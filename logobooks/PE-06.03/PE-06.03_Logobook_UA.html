0.0" y="1016.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#848B9A" text-anchor="end">Primeegg Distribution SL · 26.11.2026</text><text x="120.0" y="300.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#22304D">Розбите яйце на сковороді: хвилястий білок обведено</text><text x="120.0" y="340.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#22304D">небесно-блакитним контуром, а жовток із дванадцятьма</text><text x="120.0" y="380.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#22304D">променями стає сонцем. Відблиск на жовтку робить його</text><text x="120.0" y="420.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#22304D">об’ємним і «живим». Знак зчитується з першого погляду й</text><text x="120.0" y="461.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#22304D">одразу викликає відчуття ранку, сніданку й тепла.</text><text x="120.0" y="531.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#22304D">Сонце — найкоротший шлях до образу Іспанії та</text><text x="120.0" y="571.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#22304D">Середземномор’я, а блакитний контур — до неба й моря.</text><text x="120.0" y="612.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#22304D">Дружній округлий Nunito і соковита палітра роблять логотип</text><text x="120.0" y="652.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#22304D">сильним на полиці: коробка для яєць, етикетка, вітрина</text><text x="120.0" y="692.7" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#22304D">магазину. Для B2B і HoReCa знак зберігає ясність і<
