/text><text x="120.0" y="196.0" font-family="Manrope, Georgia, serif" font-size="60" font-weight="600" fill="#0D2B4E">Концепция</text><text x="120.0" y="1016.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#78889A">Средиземноморский горизонт</text><text x="1800.0" y="1016.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#78889A" text-anchor="end">Primeegg Distribution SL · 26.11.2026</text><text x="120.0" y="300.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0D2B4E">Знак — яйцо, внутри которого солнце-желток опускается за</text><text x="120.0" y="340.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0D2B4E">линию моря. Три полосы воды вырезаны из формы негативным</text><text x="120.0" y="380.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0D2B4E">пространством, поэтому яйцо и пейзаж читаются одновременно:</text><text x="120.0" y="420.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0D2B4E">продукт, восход и побережье Испании в одном силуэте.</text><text x="120.0" y="461.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0D2B4E">Лаконичный гротеск Inter с выделенным «egg» продолжает</text><text x="120.0" y="501.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0D2B4E">геометрию знака и сохраняет имя единым словом.</text><text x="120.0" y="571.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0D2B4E">Для B2B и HoReCa знак выглядит спокойно и надёжно: строгая</text><text x="120.0" y="612.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0D2B4E">палитра лазури и тёмно-синего говорит о системной</text><text x="120.0" y="652.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0D2B4E">логистике, а жёлтое солнце добавляет тепла и свежести.</text><text x="120.0" y="692.7" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0D2B4E">Силуэт без мелких деталей держится в 16 px, на штампе по</text><text x="120.0" y="733.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0D2B4E">скорлупе и в одноцветной флексопечати по картону, а на</text><text x="120.0" y="773.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0D2B4E">ретейл-упаковке яркий желток работает как акцент на полке.</text><rect x="1080" y="250" width="720" height="320" rx="16" fill="#FFFFFF" stroke="#D7DBDE"/><g transform="translate(1305.00,275.00) scale(1.3500)">

0.0" y="952.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#78889A">слово</text></svg></section><section id="s03" aria-label="03 Основной логотип"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img"><rect width="1920" height="1080" fill="#FBFAF7"/><text x="120.0" y="92.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#78889A" letter-spacing="3">PRIMEEGG · ЛОГОБУК · PE-01.05</text><text x="1800.0" y="92.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#78889A" text-anchor="end" letter-spacing="2">03 / 12</text><text x="120.0" y="196.0" font-family="Manrope, Georgia, serif" font-size="60" font-weight="600" fill="#0D2B4E">Основной логотип</text><text x="120.0" y="1016.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#78889A">Средиземноморский горизонт</text><text x="1800.0" y="1016.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#78889A" text-anchor="end">Primeegg Distribution SL · 26.11.2026</text><rect x="120" y="250" width="1680" height="640" rx="16" fill="#FFFFFF" stroke="#D7DBDE"/><g transform="translate(573.33,280.00) scale(1.9333)">
