</g><text x="120.0" y="300.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1D5FA8" letter-spacing="6">MANUAL DE LOGOTIPO</text><text x="120.0" y="400.0" font-family="Manrope, Georgia, serif" font-size="72" font-weight="600" fill="#0D2B4E">Horizonte</text><text x="120.0" y="484.0" font-family="Manrope, Georgia, serif" font-size="72" font-weight="600" fill="#0D2B4E">mediterráneo</text><text x="120.0" y="544.0" font-family="Manrope, Georgia, serif" font-size="30" font-weight="400" fill="#78889A" font-style="italic">Mediterranean Horizon</text><text x="120.0" y="644.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#0D2B4E">La frescura de la mañana mediterránea en cada</text><text x="120.0" y="687.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#0D2B4E">entrega.</text><line x1="120" y1="870" x2="878" y2="870" stroke="#D7DBDE" stroke-width="2"/><text x="120.0" y="920.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#0D2B4E">Primeegg Distribution SL</text><text x="120.0" y="956.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#78889A">Concepto PE-01.05 · versión 1.0 · 26.11.2026</text><text x="120.0" y="92.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#78889A" letter-spacing="3">PRIMEEGG · PE-01.05</text></svg></section><section id="s02" aria-label="02 Concepto"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img"><rect width="1920" height="1080" fill="#FBFAF7"/><text x="120.0" y="92.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#78889A" letter-spacing="3">PRIMEEGG · MANUAL DE LOGOTIPO · PE-01.05</text><text x="1800.0" y="92.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#78889A" text-anchor="end" letter-spacing="2">02 / 12</text><text x="120.0" y="196.0" font-family="Manrope, Georgia, serif" font-size="60" font-weight="600" fill="#0D2B4E">Concepto</text><text x="120.0" y="1016.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#78889A">Horizonte mediterráneo</text><text x="1800.0" y="1016.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#78889A" text-anchor="end">Primeegg Distribution SL · 26.11.2026</text><text x="120.0" y="300.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0D2B4E">El símbolo es un huevo en cuyo interior un sol-yema se pone</text><text x="120.0" y="340.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0D2B4E">tras la línea del mar. Tres franjas de agua se recortan de</text><text x="120.0" y="380.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0D2B4E">la forma con espacio negativo, de modo que el huevo y el</text><text x="120.0" y="420.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0D2B4E">paisaje se leen a la vez: el producto, el amanecer y la</text><text x="120.0" y="461.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0D2B4E">costa de España en una sola silueta. La sobria sans serif</text><text x="120.0" y="501.5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0D2B4E">Inter, con «egg» destacado, prolonga la geometría del</text><text x="120.0" y="541.8" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0D2B4E">símbolo y mantiene el nombre como una sola palabra.</text><text x="120.0" y="612.1" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0D2B4E">Para B2B y HoReCa, el símbolo transmite calma y fiabilidad:</text><text x="120.0" y="652.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0D2B4E">la sobria paleta de azul celeste y azul marino habla de una</text><text x="120.0" y="692.7" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0D2B4E">logística ordenada, y el sol amarillo aporta calidez y</text><text x="120.0" y="733.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0D2B4E">frescura. La silueta, sin detalles pequeños, resiste a 16</text><text x="120.0" y="773.3" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0D2B4E">px, en el sello sobre la cáscara y en flexografía a una</text><text x="120.0" y="813.6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0D2B4E">tinta sobre cartón; en el envase retail, la yema brillante</text><text x="120.0" y="853.9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#0D2B4E">funciona como acento en el lineal.</text><rect x="1080" y="250" width="720" height="320" rx="16" fill="#FFFFFF" stroke="#D7DBDE"/><g transform="translate(1305.00,275.00) scale(1.3500)">

</g><text x="1080.0" y="630.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1D5FA8" letter-spacing="3">ELEMENTOS DEL SÍMBOLO</text><text x="1080.0" y="676.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#0D2B4E">Huevo</text><text x="1350.0" y="676.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#78889A">el producto y la forma de la marca,</text><text x="1350.0" y="706.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#78889A">contorno de todo el símbolo</text><text x="1080.0" y="758.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#0D2B4E">Sol-yema</text><text x="1350.0" y="758.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#78889A">frescura de la recogida matinal, calidad</text><text x="1350.0" y="788.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#78889A">«prime», calidez del sur</text><text x="1080.0" y="840.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#0D2B4E">Tres franjas de</text><text x="1080.0" y="870.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#0D2B4E">mar</text><text x="1350.0" y="840.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#78889A">el Mediterráneo y España; el ritmo de</text><text x="1350.0" y="870.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#78889A">entregas regulares</text><text x="1080.0" y="922.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#0D2B4E">Acento «egg» en</text><text x="1080.0" y="952.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#0D2B4E">el nombre</text><text x="1350.0" y="922.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#78889A">vincula el nombre con el producto sin</text><text x="1350.0" y="952.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#78889A">romper la palabra</text></svg></section><section id="s03" aria-label="03 Logotipo principal"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img"><rect width="1920" height="1080" fill="#FBFAF7"/><text x="120.0" y="92.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#78889A" letter-spacing="3">PRIMEEGG · MANUAL DE LOGOTIPO · PE-01.05</text><text x="1800.0" y="92.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#78889A" text-anchor="end" letter-spacing="2">03 / 12</text><text x="120.0" y="196.0" font-family="Manrope, Georgia, serif" font-size="60" font-weight="600" fill="#0D2B4E">Logotipo principal</text><text x="120.0" y="1016.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#78889A">Horizonte mediterráneo</text><text x="1800.0" y="1016.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#78889A" text-anchor="end">Primeegg Distribution SL · 26.11.2026</text><rect x="120" y="250" width="1680" height="640" rx="16" fill="#FFFFFF" stroke="#D7DBDE"/><g transform="translate(573.33,280.00) scale(1.9333)">
